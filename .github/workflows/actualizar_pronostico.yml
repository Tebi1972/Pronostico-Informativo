name: Actualizar pronóstico informativo

on:
  workflow_dispatch:
  schedule:
      - cron: "15 * * * *"
      - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-pronostico
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Sincronizar con main
        run: |
          git pull --rebase origin main

      - name: Obtener datos de INUMET
        run: python fetch_informativo.py

      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar datos INUMET"
          git push origin main
