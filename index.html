<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronóstico para Informativo</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#000;background:#e9edf1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:22px auto;padding:0 16px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar h1{font-size:22px;margin:0 auto 0 0}.toolbar button{border:1px solid #bbb;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;background:#fff}.primary{background:#1f5b88!important;color:#fff;border-color:#1f5b88!important}.sheet{background:#fff;padding:24px 30px;box-shadow:0 2px 12px #0002}.source{font-size:11px;color:#555;margin:0 0 16px}.section-title{font-size:16px;font-weight:800;margin:16px 0 9px;text-transform:uppercase}.current{display:block;margin:0 0 20px}.field{display:flex;gap:7px;line-height:1.45;min-height:22px}.label{font-weight:800;min-width:125px}.day{break-inside:avoid;margin:13px 0 18px}.day h2{font-size:15px;margin:0 0 7px;text-transform:uppercase}.region{display:grid;grid-template-columns:105px 145px minmax(0,1fr);gap:8px;padding:4px 0;align-items:start}.region-name{font-weight:800}.temps{font-weight:700;white-space:nowrap}.forecast{line-height:1.25}.extended{font-size:10px;color:#555;margin-top:1px}.status{font-size:13px;color:#555}.error{color:#a00000;font-weight:700}
@media(max-width:700px){.current{display:block}.region{grid-template-columns:95px 1fr}.forecast{grid-column:1/-1}.sheet{padding:18px}.toolbar{flex-wrap:wrap}.toolbar h1{width:100%}.temps{white-space:normal}}
@media print{
 @page{size:A4 portrait;margin:12mm 14mm}
 body{background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:10pt}
 .wrap{max-width:none;margin:0;padding:0}.toolbar,.source{display:none}.sheet{box-shadow:none;padding:0}
 .section-title{font-size:12pt;margin:0 0 6pt;font-weight:700}
 .current{margin:0 0 13pt}.field{font-size:10pt;line-height:1.25;min-height:0;margin:0 0 2pt}.label{min-width:31mm}
 #forecast+.x{display:none}
 .day{margin:0 0 11pt;break-inside:avoid}.day h2{font-size:10.5pt;margin:0 0 4pt;font-weight:700}
 .region{grid-template-columns:27mm 39mm 1fr;gap:2mm;padding:2pt 0;font-size:9.5pt;border:0}
 .region-name,.temps{font-weight:700}.temps{white-space:nowrap}.forecast{line-height:1.18}.extended{font-size:7.5pt;margin-top:1pt}
}
</style>
</head><body><div class="wrap">
<div class="toolbar"><h1>Pronóstico para Informativo</h1><span id="status" class="status">Cargando…</span><button class="primary" onclick="loadData()">↻ Actualizar</button><button onclick="window.print()">🖨 Imprimir</button></div>
<main class="sheet"><p class="source">Fuente exclusiva: Instituto Uruguayo de Meteorología (INUMET). Estado actual: Carrasco.</p>
<div class="section-title">ESTADO ACTUAL</div><div id="current" class="current">Cargando…</div>
<div class="section-title">PRONÓSTICO DE TRES DÍAS</div><div id="forecast">Cargando…</div></main></div>
<script>
const REGIONS=[['E','ESTE'],['NE','NORESTE'],['NW','NOROESTE'],['M','SUR'],['SO','SUROESTE']];
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function compass(deg){if(deg==null)return '—';const p=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];return p[Math.round((((+deg)%360)+360)%360/22.5)%16]}
function uyTime(iso){if(!iso)return {date:'—',time:'—'};const d=new Date(iso);return {date:new Intl.DateTimeFormat('es-UY',{timeZone:'America/Montevideo',day:'2-digit',month:'2-digit',year:'numeric'}).format(d),time:new Intl.DateTimeFormat('es-UY',{timeZone:'America/Montevideo',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}}
function extendedIconText(day){if(!day?.extended)return '';const code=String(day.weather_code??'').trim();const labels={'7':'Chaparrones','11':'Tormentas'};return labels[code]||''}
function forecastText(day){const parts=[];if(day?.morning)parts.push('Mañana: '+day.morning);if(day?.extended){const iconText=extendedIconText(day);if(iconText)parts.push(iconText+'.');if(day?.evening)parts.push(day.evening)}else if(day?.evening){parts.push('Tarde/Noche: '+day.evening)}return parts.join(' ')||'—'}
function render(data){const c=data.locations?.montevideo_carrasco||{};const t=uyTime(c.observation_time||c.condition_time);const wind=c.wind_speed_kmh==null?'—':(c.wind_speed_kmh<1?'Calmo':`${compass(c.wind_direction_deg)}/${Math.round(c.wind_speed_kmh)} km/h`);const vis=c.visibility_m==null?'—':`${(+c.visibility_m/1000).toLocaleString('es-UY',{maximumFractionDigits:1})} km`;
document.querySelector('#current').innerHTML=`<div class="field"><span class="label">FECHA:</span>${esc(t.date)}</div><div class="field"><span class="label">HORA:</span>${esc(t.time)}</div><div class="field"><span class="label">TEMPERATURA:</span>${c.temperature==null?'—':esc(c.temperature)+' °C'}</div><div class="field"><span class="label">HUMEDAD:</span>${c.humidity==null?'—':esc(c.humidity)+' %'}</div><div class="field"><span class="label">VIENTO:</span>${esc(wind)}</div><div class="field"><span class="label">VISIBILIDAD:</span>${esc(vis)}</div>`;
let html='';for(let future=1;future<=3;future++){let title=future===1?'DÍA SIGUIENTE':future===2?'SEGUNDO DÍA':'TERCER DÍA';let ref=null;for(const [code] of REGIONS){const d=data.forecasts?.[code]?.days?.[future];if(d){ref=d;break}}html+=`<section class="day"><h2>${title}${ref?.date?' — '+esc(ref.date):''}</h2>`;for(const [code,name] of REGIONS){const d=data.forecasts?.[code]?.days?.[future];if(!d){html+=`<div class="region"><div class="region-name">${name}:</div><div class="temps">—</div><div class="forecast">Sin datos disponibles</div></div>`;continue}html+=`<div class="region"><div class="region-name">${name}:</div><div class="temps">MÍN ${esc(d.min)}° / MÁX ${esc(d.max)}°</div><div class="forecast">${esc(forecastText(d))}${d.extended?'<div class="extended">Pronóstico extendido de INUMET.</div>':''}</div></div>`}html+='</section>'}document.querySelector('#forecast').innerHTML=html;document.querySelector('#status').textContent='Datos: '+(data.updated||'actualizados')}
async function loadData(){const s=document.querySelector('#status');s.textContent='Actualizando…';s.classList.remove('error');try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json())}catch(e){s.textContent='No se pudo cargar data.json';s.classList.add('error')}}loadData();
</script></body></html>
