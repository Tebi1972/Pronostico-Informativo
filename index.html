<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronóstico Informativo</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#e9e9e9;color:#000;font-family:Arial,Helvetica,sans-serif}
  .toolbar{position:sticky;top:0;z-index:10;background:#222;color:#fff;padding:10px;text-align:center}
  button{font-size:16px;padding:8px 18px;cursor:pointer}
  .page{width:210mm;min-height:297mm;margin:12mm auto;background:#fff;padding:18mm 18mm 16mm;box-shadow:0 2px 10px #999;font-size:16pt;line-height:1.32}
  h1{text-align:center;font-size:23pt;margin:0 0 14mm;font-weight:700}
  h2{text-align:center;font-size:19pt;margin:13mm 0 8mm}
  .meta{margin-bottom:11mm}.meta div{margin:3mm 0}.current-regions div{margin:7mm 0}
  .day{margin:0 0 10mm}.day-title{font-size:18pt;font-weight:700;margin-bottom:5mm}
  .region{margin:0 0 5mm}.region-name{font-weight:700}.temps{white-space:nowrap}
  .forecast-text{margin-top:1mm}
  .error{padding:20px;color:#900;font-weight:bold}
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:297mm;page-break-after:always;overflow:hidden}.page:last-child{page-break-after:auto}
  }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">Imprimir</button></div>
<div id="app"><div class="error">Cargando datos de INUMET…</div></div>
<script>
const REGION_ORDER=[
  {label:'Norte', current:'Norte', forecast:'NW'},
  {label:'Este',  current:'Este',  forecast:'E'},
  {label:'Sur',   current:'Sur',   forecast:'M'},
  {label:'Oeste', current:'Oeste', forecast:'SO'}
];
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>v==null||v===''?'—':Number(v).toFixed(d).replace('.',',');
function cardinal(deg){if(deg==null||deg==='')return '—';const a=['N','NE','E','SE','S','SO','O','NO'];return a[Math.round(Number(deg)/45)%8]}
function uyDateTime(iso){
  if(!iso)return {date:'—',time:'—'};
  const d=new Date(iso); if(isNaN(d))return {date:'—',time:'—'};
  const parts=new Intl.DateTimeFormat('es-UY',{timeZone:'America/Montevideo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const o=Object.fromEntries(parts.map(x=>[x.type,x.value])); return {date:`${o.day}/${o.month}/${o.year}`,time:`${o.hour}:${o.minute}`};
}
function forecastText(day){
  if(!day)return '—';
  const a=[];
  if(day.morning)a.push(`Mañana: ${day.morning}`);
  if(day.evening)a.push(`${day.extended?'Pronóstico:':'Tarde/Noche:'} ${day.evening}`);
  return a.join(' ' )||'—';
}
function render(d){
  const c=d.current||{}; const dt=uyDateTime(c.observation_time);
  const vis=c.visibility_m==null?'—':`${num(Number(c.visibility_m)/1000,1)} km`;
  const wind=c.wind_speed_kmh==null?'—':`${cardinal(c.wind_direction_deg)} ${num(c.wind_speed_kmh,1)} km/h`;
  const currents=REGION_ORDER.map(r=>{const x=(d.current_regions||{})[r.current]||{};return `<div><b>${r.label}:</b> temperatura actual ${num(x.temperature,1)}° - ${esc(x.condition)}</div>`}).join('');
  // Se imprimen los tres días futuros: mañana, pasado mañana y el tercero (extendido de INUMET).
  const days=[1,2,3].map((idx,i)=>{
    const regs=REGION_ORDER.map(r=>{const day=(((d.forecasts||{})[r.forecast]||{}).days||[])[idx];return `<div class="region"><span class="region-name">${r.label}:</span> <span class="temps">máx. ${day?esc(day.max):'—'}° / mín. ${day?esc(day.min):'—'}°.</span><div class="forecast-text">${esc(forecastText(day))}</div></div>`}).join('');
    return `<section class="day"><div class="day-title">${['Primer día','Segundo día','Tercer día'][i]}:</div>${regs}</section>`;
  }).join('');
  document.getElementById('app').innerHTML=`
  <section class="page">
    <h1>TIEMPO ACTUAL</h1>
    <div class="meta">
      <div><b>Fecha:</b> ${dt.date}</div><div><b>Hora:</b> ${dt.time}</div>
      <br>
      <div><b>Temperatura:</b> ${num(c.temperature,1)}°</div>
      <div><b>Humedad:</b> ${c.humidity==null?'—':num(c.humidity)+'%'}</div>
      <div><b>Visibilidad:</b> ${vis}</div>
      <div><b>Viento:</b> ${wind}</div>
    </div>
    <h2>Datos actuales</h2><div class="current-regions">${currents}</div>
  </section>
  <section class="page"><h1>PRONÓSTICO</h1>${days}</section>`;
}
fetch('data.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render).catch(e=>{document.getElementById('app').innerHTML='<div class="error">No se pudo cargar data.json: '+esc(e.message)+'</div>'});
</script>
</body></html>
